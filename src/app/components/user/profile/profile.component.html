<div class="profile-container">
  <div class="header">
    <h2>My Profile</h2>
    <button (click)="logout()" class="logout-btn">Logout</button>
  </div>

  <div *ngIf="user">
    <p *ngIf="successMessage" class="success">{{ successMessage }}</p>

    <div *ngIf="!editing" class="info">
      <p><strong>First Name:</strong> {{ user.firstName }}</p>
      <p><strong>Last Name:</strong> {{ user.lastName }}</p>
      <p><strong>Email:</strong> {{ user.email }}</p>
      <p><strong>DNI:</strong> {{ user.dni }}</p>
      <p><strong>Role:</strong> {{ user.role }}</p>
      <p><strong>Status:</strong> {{ user.status }}</p>
      <button (click)="startEditing()">Edit Profile</button>
    </div>

    <form #profileForm="ngForm" *ngIf="editing" (ngSubmit)="onUpdate()">
      <div>
        <label>First Name</label>
        <input type="text" [(ngModel)]="updateRequest.firstName" name="firstName" required />
      </div>
      <div>
        <label>Last Name</label>
        <input type="text" [(ngModel)]="updateRequest.lastName" name="lastName" required />
      </div>
      <div>
        <label>Email</label>
        <input type="email" [(ngModel)]="updateRequest.email" name="email" required email />
      </div>
      <div>
        <label>New Password (optional)</label>
        <input type="password" [(ngModel)]="updateRequest.password" name="password" minlength="8" #password="ngModel" />
        <p class="hint" *ngIf="password.invalid && password.touched">At least 8 characters</p>
      </div>
      <div>
        <label>Confirm New Password</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" />
      </div>

      <ul *ngIf="errorMessages.length" class="error">
        <li *ngFor="let msg of errorMessages">{{ msg }}</li>
      </ul>

      <div class="buttons">
        <button type="submit" [disabled]="loading || profileForm.invalid">
          {{ loading ? 'Saving...' : 'Save' }}
        </button>
        <button type="button" (click)="editing = false">Cancel</button>
      </div>
    </form>
  </div>
</div>
